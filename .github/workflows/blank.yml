
name: Build Spider Clock APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner
          mkdir -p "$ANDROID_HOME/platforms/android-35"
          curl -L https://dl.google.com/android/repository/platform-35_r02.zip -o platform.zip
          unzip -q platform.zip -d "$ANDROID_HOME/platforms/android-35"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"

      - name: Compile Android resources
        run: |
          mkdir -p gen build/classes
          aapt package -f -m -J gen -M AndroidManifest.xml -S res \
            -I "$ANDROID_JAR" --min-sdk-version 23 --target-sdk-version 28

      - name: Compile Java
        run: |
          javac -source 8 -target 8 -classpath "$ANDROID_JAR" \
            -d build/classes gen/com/spiderclock/widget/R.java \
            src/com/spiderclock/SpiderClockWidget.java

      - name: Convert to DEX
        run: |
          curl -L https://storage.googleapis.com/r8-releases/raw/main/r8.jar -o r8.jar
          java -cp r8.jar com.android.tools.r8.D8 --lib "$ANDROID_JAR" \
            --min-api 23 --output build build/classes/com/spiderclock/SpiderClockWidget.class

      - name: Package APK
        run: |
          aapt package -f -M AndroidManifest.xml -S res -I "$ANDROID_JAR" \
            --min-sdk-version 23 --target-sdk-version 28 -F unsigned.apk
          (cd build && zip -q -u ../unsigned.apk classes.dex)
          zipalign -f 4 unsigned.apk SpiderClock-aligned.apk
          keytool -genkeypair -keystore clock.keystore -storepass android \
            -keypass android -alias spiderclock -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Spider Clock"
          apksigner sign --ks clock.keystore --ks-pass pass:android \
            --key-pass pass:android --out SpiderClock.apk SpiderClock-aligned.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClock-APK
          path: SpiderClock.apk
